    async function initDB() {
      const SQL = await initSqlJs({
        locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/${file}`
      });
      document.getElementById('status').textContent = 'Ready';
      document.getElementById('status').classList.add('ready');
      return SQL;

    let SQL;
    window.addEventListener('DOMContentLoaded', async () => {

    window.uploadCSV = async function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('file-info');
      statusEl.textContent = `Loading ${file.name}...`;

      try {
        const text = await file.text();
        const lines = text.split('\n').filter(line => line.trim());

        if (lines.length === 0) {
          throw new Error('Empty CSV file');
        }

        const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
        const rows = lines.slice(1).map(line => {
          const values = [];
          let current = '';
          let inQuotes = false;

          for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              values.push(current.trim().replace(/^"|"$/g, ''));
              current = '';
            } else {
              current += char;
            }
          }
          values.push(current.trim().replace(/^"|"$/g, ''));
          return values;
        }).filter(row => row.some(val => val));

        db = new SQL.Database();

        const columnDefs = headers.map(h => `"${h}" TEXT`).join(', ');
        db.run(`CREATE TABLE data (${columnDefs})`);

        const stmt = db.prepare(`INSERT INTO data VALUES (${headers.map(() => '?').join(', ')})`);
        rows.forEach(row => {
          if (row.length === headers.length) {
            stmt.run(row);
          } else if (row.length < headers.length) {
            const paddedRow = [...row, ...Array(headers.length - row.length).fill('')];
            stmt.run(paddedRow);
          } else {
            stmt.run(row.slice(0, headers.length));
          }
        });
        stmt.free();

        const count = rows.length;
        const sizeKB = (file.size / 1024).toFixed(1);
        const sizeLabel = sizeKB > 1024 ? `${(sizeKB / 1024).toFixed(1)}MB` : `${sizeKB}KB`;

        statusEl.textContent = `${file.name} (${sizeLabel}, ${count.toLocaleString()} rows)`;
        statusEl.classList.add('loaded');

        document.getElementById('query-input').value = 'SELECT * FROM data LIMIT 100';
        document.getElementById('query-input').focus();

        csvLoaded = true;
        updateAIState();

      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.classList.add('error');
        console.error(err);
      }
    };

    let tableSchema = '';

    function updateAIState() {
      const toggle = document.getElementById('ai-toggle');
      const toggleLabel = document.querySelector('.toggle-label');
      const chatInput = document.getElementById('chat-input');
      const chatSend = document.getElementById('chat-send');
      const chatMessages = document.getElementById('chat-messages');

      if (aiEnabled && csvLoaded) {
        toggleLabel.textContent = 'ON';

        try {
          const result = db.exec('PRAGMA table_info(data)');
          const columns = result[0].values.map(col => ({
            name: col[1],
            type: col[2]
          }));

          const rowCountResult = db.exec('SELECT COUNT(*) FROM data');
          const rowCount = rowCountResult[0].values[0][0];

          tableSchema = `Table: data\nColumns:\n${columns.map(c => `- ${c.name} (${c.type})`).join('\n')}\nTotal rows: ${rowCount}`;

          chatMessages.innerHTML = `<div class="chat-message assistant">I can help you write SQL queries for your data. I know your table has these columns:\n\n${columns.map(c => c.name).join(', ')}\n\nAsk me anything like "show me rows where X > 100" or "group by category and count".</div>`;

          chatInput.disabled = false;
          chatSend.disabled = false;
          chatInput.focus();

        } catch (err) {
          console.error('Schema error:', err);
        }
      } else {
        toggleLabel.textContent = 'OFF';
        chatInput.disabled = true;
        chatSend.disabled = true;

        if (!csvLoaded) {
          chatMessages.innerHTML = '<div class="empty ai-disabled-msg">Upload a CSV first, then toggle AI ON to ask questions.</div>';
        } else {
          chatMessages.innerHTML = '<div class="empty ai-disabled-msg">AI assistant is disabled. Toggle it ON to ask SQL questions.</div>';
        }
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('ai-toggle').addEventListener('change', (e) => {
        aiEnabled = e.target.checked;
        updateAIState();
      });

      document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    });

    async function sendMessage() {
      if (!aiEnabled) {
        alert('Please enable the AI assistant toggle first');
        return;
      }

      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      const messagesDiv = document.getElementById('chat-messages');

      messagesDiv.innerHTML += `<div class="chat-message user">${message}</div>`;
      input.value = '';

      messagesDiv.innerHTML += `<div class="chat-message assistant">Thinking...</div>`;
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const response = await fetch('http://localhost:8001/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              {
                role: 'system',
                content: `You are a SQL query assistant. The user has loaded a CSV file into a SQLite database. Here is the schema:\n\n${tableSchema}\n\nYour job is to:\n1. ONLY respond with SQL queries that work on this exact table\n2. Always use the table name "data"\n3. Format SQL queries in markdown code blocks with \`\`\`sql\n4. Keep explanations brief\n5. Never suggest anything other than SQL queries\n6. If asked about non-SQL topics, redirect to SQL help\n7. CRITICAL: Always test your SQL syntax - ensure proper spacing between keywords (SELECT x FROM not SELECT xFROM)\n8. Use single quotes for string literals, not double quotes\n9. Column names are case-sensitive - match them exactly\n\nBe concise, practical, and syntactically correct.`
              },
              {
                role: 'user',
                content: message
              }
            ],
            temperature: 0.3
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`API returned ${response.status}: ${errorText}`);
        }

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message);
        }

        const assistantMessage = data.choices[0].message.content;

        const lastMessage = messagesDiv.lastElementChild;
        lastMessage.innerHTML = formatMessage(assistantMessage);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

      } catch (err) {
        const lastMessage = messagesDiv.lastElementChild;
        if (err.message.includes('Failed to fetch')) {
          lastMessage.innerHTML = `Error: Cannot connect to proxy server. Make sure proxy-server.py is running on port 8001.`;
        } else {
          lastMessage.innerHTML = `Error: ${err.message}`;
        }
        lastMessage.style.background = '#dc2626';
      }
    }

    function formatMessage(text) {
      const msgId = 'msg-' + Math.random().toString(36).substr(2, 9);
      const formatted = text.replace(/```sql\n([\s\S]*?)```/g, (match, code) => {
        const id = 'code-' + Math.random().toString(36).substr(2, 9);
        const cleanCode = code.trim();
        return `<pre id="${id}" data-code="${cleanCode.replace(/"/g, '&quot;')}">${cleanCode}<button class="copy-btn" onclick="copyCode('${id}')">Copy</button><button class="copy-btn" onclick="insertQuery('${id}')" style="background: #06b6d4;">Use Query</button></pre>`;
      }).replace(/```\n([\s\S]*?)```/g, (match, code) => {
        const id = 'code-' + Math.random().toString(36).substr(2, 9);
        return `<pre id="${id}">${code.trim()}<button class="copy-btn" onclick="copyCode('${id}')">Copy</button></pre>`;
      }).replace(/\n/g, '<br>');

      return `<div id="${msgId}" class="message-content">${formatted}</div><button class="copy-message-btn" onclick="copyMessage('${msgId}')" title="Copy message">📋</button>`;
    }

    window.copyCode = function(id) {
      const pre = document.getElementById(id);
      const code = pre.textContent.replace('Copy', '').trim();
      navigator.clipboard.writeText(code);

      const btn = pre.querySelector('.copy-btn');
      const originalText = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => {
        btn.textContent = originalText;
      }, 2000);
    };

    window.copyMessage = function(msgId) {
      const msgDiv = document.getElementById(msgId);
      let text = msgDiv.innerText || msgDiv.textContent;

      // Remove "Copy" and "Use Query" button text from code blocks
      text = text.replace(/Copy/g, '').replace(/Use Query/g, '').trim();

      navigator.clipboard.writeText(text);

      const btn = event.target;
      btn.textContent = '✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋';
        btn.classList.remove('copied');
      }, 2000);
    };

    window.insertQuery = function(id) {
      const pre = document.getElementById(id);
      const code = pre.getAttribute('data-code') || pre.textContent.replace(/Copy/g, '').replace(/Use Query/g, '').trim();
      document.getElementById('query-input').value = code;
      document.getElementById('query-input').focus();
    };

    window.runQuery = async function() {
      const query = document.getElementById('query-input').value.trim();
      if (!query) return;

      const resultsEl = document.getElementById('results');
      const errorEl = document.getElementById('error');

      errorEl.textContent = '';
      errorEl.style.display = 'none';
      resultsEl.innerHTML = '<div class="loading">Running query...</div>';

      try {
        const result = db.exec(query);

        if (result.length === 0) {
          resultsEl.innerHTML = '<div class="empty">No results</div>';
          return;
        }

        renderTable('results', result);

      } catch (err) {
        resultsEl.innerHTML = '';
        let errorMsg = err.message;

        // Add helpful suggestions for common errors
        if (errorMsg.includes('syntax error')) {
          errorMsg += '\n\n💡 Tip: Check for missing spaces between keywords (e.g., "SELECT column FROM" not "SELECT columnFROM")';
        } else if (errorMsg.includes('no such column')) {
          errorMsg += '\n\n💡 Tip: Column names are case-sensitive. Available columns: formularyID, affectedDrugOption, formularyVersion, rxCUI, rxNormBrandName, rxNormSCDC, rxNormDoseForm, tierLevel, selectedDrug';
        } else if (errorMsg.includes('no such table')) {
          errorMsg += '\n\n💡 Tip: The table name is "data" (lowercase)';
        }

        errorEl.textContent = errorMsg;
        errorEl.style.display = 'block';
        errorEl.style.whiteSpace = 'pre-wrap';
      }
    };

    function renderTable(targetId, result) {
      const target = document.getElementById(targetId);

      if (result.length === 0 || !result[0].values.length) {
        target.innerHTML = '<div class="empty">No results</div>';
        return;
      }

      const columns = result[0].columns;
      const rows = result[0].values;

      let html = '<table><thead><tr>';
      columns.forEach(col => {
        html += `<th>${col}</th>`;
      });
      html += '</tr></thead><tbody>';

      rows.forEach(row => {
        html += '<tr>';
        row.forEach(val => {
          html += `<td>${val !== null && val !== undefined ? val : '<span class="null">NULL</span>'}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      html += `<div class="row-count">${rows.length.toLocaleString()} rows</div>`;

      target.innerHTML = html;
    }

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        runQuery();
      }
    });
  </script>

      color: #605d52;
      text-align: right;
      font-weight: 600;
    }

    @media (max-width: 1024px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto 400px;
        height: auto;
        min-height: calc(100vh - 120px);
      }

      .left-pane {
        border-right: none;
        border-bottom: 1px solid #e5e7eb;
      }

      .api-key-wrapper {
        margin-left: 0;
        margin-top: 0.75rem;
      }

      .upload-area .upload-wrapper {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .error-msg {
      color: #201515;
      padding: 16px;
    }

    .ai-disabled-msg {
      color: #939084;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Synth</h1>
    <div id="status">Initializing...</div>
  </div>

  <div class="upload-area">
    <div class="upload-wrapper">
      <input type="file" id="file-upload" accept=".csv" onchange="uploadCSV(event)">
      <label for="file-upload" class="upload-btn">Upload CSV</label>
      <div id="file-info">No file selected</div>
    </div>
  </div>

  <div class="workspace">
    <div class="left-pane">
      <div class="editor-section">
        <div class="editor-label">SQL Query</div>
        <textarea id="query-input" placeholder="SELECT * FROM data&#10;WHERE column = 'value'&#10;ORDER BY column DESC&#10;LIMIT 100"></textarea>
        <div class="editor-actions">
          <button class="run-btn" onclick="runQuery()">
            <span>Run Query</span>
            <span>▶</span>
          </button>
          <div class="keyboard-hint">⌘ Enter or Ctrl Enter</div>
        </div>
      </div>

      <div class="results-section">
        <div class="section-label">Query Results</div>
        <div id="error"></div>
        <div id="results">
          <div class="empty">Run a query to see results</div>
        </div>
      </div>
    </div>

    <div class="preview-pane">
      <div class="ai-header">
        <div class="section-label">AI SQL Assistant</div>
        <label class="toggle-switch">
          <input type="checkbox" id="ai-toggle">
          <span class="toggle-slider"></span>
          <span class="toggle-label">OFF</span>
        </label>
      </div>
      <div id="chat-container">
        <div id="chat-messages">
          <div class="empty ai-disabled-msg">AI assistant is disabled. Toggle it ON to ask SQL questions.</div>
        </div>
        <div class="chat-input-wrapper">
          <input type="text" id="chat-input" placeholder="Ask about your data... e.g., 'show me all rows where amount > 1000'" disabled />
          <button id="chat-send" onclick="sendMessage()" disabled>Send</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
